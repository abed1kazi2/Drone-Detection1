function goTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelector(`[onclick="goTab('${name}')"]`).classList.add('active');
  $(`page-${name}`).classList.add('active');
  syncModelStatus();
}

// Log, Toast, syncModelStatus functions (same as before)
function log(msg, cls=''){
  const box = $('log-box') || document.createElement('div');
  if(!box.id) return console.log(msg);
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = `[${new Date().toLocaleTimeString('en-US',{hour12:false})}] ${msg}`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function toast(msg, color='var(--accent)'){
  const t = $('toast');
  t.textContent=msg; t.style.borderColor=color; t.style.color=color;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

function syncModelStatus(){
  ['vid','wc'].forEach(prefix=>{
    const dot = $(`${prefix}-mdot`), st = $(`${prefix}-mst`);
    if(session){ dot.className='dot g'; st.textContent='Model ready ✅'; }
    else { dot.className='dot r'; st.textContent='Load model in Image tab first'; }
  });
}

// ── Model Loading ───────────────────────────────────────
async function loadModel(input){
  const file = input.files[0]; if(!file) return;
  $('onnx-name').textContent = file.name;
  $('model-dot').className = 'dot pulse b';
  $('model-st').textContent = 'LOADING...';

  try{
    const buf = await file.arrayBuffer();
    session = await ort.InferenceSession.create(buf, {executionProviders:['wasm']});
    
    // Auto detect input size from model
    if(session.inputs && session.inputs[0]){
      const shape = session.inputs[0].type.shape;
      modelInputSize = shape[2] || shape[3] || 820;
    }

    $('model-dot').className = 'dot g';
    $('model-st').textContent = `MODEL READY (${modelInputSize}×${modelInputSize})`;
    log(`✅ Model loaded — Input Size: ${modelInputSize}×${modelInputSize}`,'lok');
    toast('Model loaded successfully!', 'var(--green)');
    syncModelStatus();
  }catch(e){
    log(`❌ ${e.message}`,'lerr');
    toast('Failed to load model', 'var(--red)');
  }
}

// ── Preprocess (Dynamic Size) ───────────────────────────
function preprocess(src, sW, sH){
  const oc = document.createElement('canvas');
  oc.width = modelInputSize;
  oc.height = modelInputSize;
  const ctx = oc.getContext('2d');
  
  const sc = Math.min(modelInputSize/sW, modelInputSize/sH);
  const nW = Math.round(sW*sc), nH = Math.round(sH*sc);
  const pX = Math.floor((modelInputSize-nW)/2);
  const pY = Math.floor((modelInputSize-nH)/2);

  ctx.fillStyle = '#808080';
  ctx.fillRect(0,0,modelInputSize,modelInputSize);
  ctx.drawImage(src, 0, 0, sW, sH, pX, pY, nW, nH);

  const {data} = ctx.getImageData(0,0,modelInputSize,modelInputSize);
  const f32 = new Float32Array(3 * modelInputSize * modelInputSize);

  for(let i = 0; i < modelInputSize*modelInputSize; i++){
    f32[i]                     = data[i*4]   / 255;
    f32[i + modelInputSize*modelInputSize]   = data[i*4+1] / 255;
    f32[i + 2*modelInputSize*modelInputSize] = data[i*4+2] / 255;
  }

  return {
    tensor: new ort.Tensor('float32', f32, [1, 3, modelInputSize, modelInputSize]),
    sc, pX, pY
  };
}
