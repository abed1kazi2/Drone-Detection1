<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SENTINEL - Drone Detection</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080c10;--bg2:#0d1318;--panel:#0f1923;--border:#1a2a35;
  --accent:#00d4ff;--green:#00ff88;--red:#ff4444;--warn:#ffaa00;
  --text:#c8d8e0;--muted:#4a6070;
  --hud:'Share Tech Mono',monospace;--ui:'Rajdhani',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--ui);min-height:100vh;}
header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;border-bottom:1px solid var(--border);background:rgba(8,12,16,0.97);}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{width:36px;height:36px;border:1.5px solid var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-title{font-size:20px;font-weight:700;letter-spacing:3px;color:#fff;}
.tab{padding:12px 24px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;font-weight:600;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px;}
button{padding:10px 20px;margin:5px;border:none;border-radius:6px;cursor:pointer;font-weight:600;}
.btn-primary{background:var(--accent);color:#000;}
.btn-success{background:var(--green);color:#000;}
.log{background:#000;padding:12px;height:140px;overflow-y:auto;font-family:var(--hud);font-size:12px;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🚁</div>
    <div class="logo-title">SENTINEL</div>
  </div>
  <div style="color:var(--accent);font-family:var(--hud);">820×820 MODEL</div>
</header>

<nav style="display:flex;background:var(--bg2);border-bottom:1px solid var(--border);">
  <div class="tab active" onclick="goTab(0)">Image</div>
  <div class="tab" onclick="goTab(1)">Webcam</div>
</nav>

<main style="max-width:1200px;margin:20px auto;padding:0 20px;">

  <!-- Model Loader -->
  <div class="panel">
    <h3>⬡ Load ONNX Model</h3>
    <input type="file" id="modelFile" accept=".onnx" style="margin:10px 0;" onchange="loadModel(this)"/>
    <div id="modelStatus" style="color:var(--accent);font-family:var(--hud);margin-top:8px;">No model loaded</div>
  </div>

  <!-- Image Tab -->
  <div id="tab0">
    <div class="panel">
      <h3>📷 Upload Image</h3>
      <input type="file" id="imgFile" accept="image/*" onchange="handleImage(this)"/>
      <button class="btn-primary" onclick="runDetection()" style="margin-top:10px;">Run Detection</button>
    </div>
    <div class="panel">
      <canvas id="outputCanvas" style="max-width:100%;background:#000;border-radius:8px;"></canvas>
    </div>
    <div class="log" id="log"></div>
  </div>

  <!-- Webcam Tab -->
  <div id="tab1" style="display:none;">
    <div class="panel">
      <button class="btn-success" onclick="startWebcam()">Start Webcam</button>
      <button class="btn-primary" onclick="toggleLiveDetection()" id="liveBtn">Start Live Detection</button>
      <button onclick="stopWebcam()">Stop</button>
    </div>
    <div class="panel">
      <video id="video" autoplay playsinline style="width:100%;max-width:640px;background:#000;border-radius:8px;"></video>
      <canvas id="wcCanvas" style="display:none;width:100%;max-width:640px;"></canvas>
    </div>
  </div>

</main>

<script>
// Global variables
let session = null;
let modelInputSize = 820;
let currentImg = null;
let isLive = false;
let stream = null;

// Tab Switch
function goTab(n) {
  document.getElementById('tab0').style.display = n===0 ? 'block' : 'none';
  document.getElementById('tab1').style.display = n===1 ? 'block' : 'none';
}

// Load Model
async function loadModel(input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('modelStatus').textContent = "Loading " + file.name + "...";
  try {
    const buffer = await file.arrayBuffer();
    session = await ort.InferenceSession.create(buffer);
    document.getElementById('modelStatus').innerHTML = `✅ Loaded <b>${file.name}</b> (${modelInputSize}×${modelInputSize})`;
    log("Model loaded successfully");
  } catch(e) {
    document.getElementById('modelStatus').textContent = "❌ Load failed";
    log("Error loading model: " + e.message, "red");
  }
}

// Simple logging
function log(msg, color="white") {
  const logEl = document.getElementById('log');
  const entry = document.createElement('div');
  entry.style.color = color;
  entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(entry);
  logEl.scrollTop = logEl.scrollHeight;
}

// Preprocess
function preprocess(img) {
  const canvas = document.createElement('canvas');
  canvas.width = modelInputSize;
  canvas.height = modelInputSize;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0,0,modelInputSize,modelInputSize);
  const scale = Math.min(modelInputSize/img.width, modelInputSize/img.height);
  const newW = img.width * scale;
  const newH = img.height * scale;
  const x = (modelInputSize - newW)/2;
  const y = (modelInputSize - newH)/2;
  ctx.drawImage(img, x, y, newW, newH);
  
  const data = ctx.getImageData(0,0,modelInputSize,modelInputSize).data;
  const tensorData = new Float32Array(3*modelInputSize*modelInputSize);
  for (let i = 0; i < modelInputSize*modelInputSize; i++) {
    tensorData[i] = data[i*4]/255;
    tensorData[i + modelInputSize*modelInputSize] = data[i*4+1]/255;
    tensorData[i + 2*modelInputSize*modelInputSize] = data[i*4+2]/255;
  }
  return new ort.Tensor('float32', tensorData, [1, 3, modelInputSize, modelInputSize]);
}

// Run Detection on Image
async function runDetection() {
  const fileInput = document.getElementById('imgFile');
  if (!fileInput.files[0] || !session) {
    alert("Please load model and select an image");
    return;
  }
  log("Running detection...");
  const img = new Image();
  img.onload = async () => {
    currentImg = img;
    const tensor = preprocess(img);
    try {
      const output = await session.run({[session.inputNames[0]]: tensor});
      log("Inference completed - " + output[session.outputNames[0]].dims);
      // TODO: Add full post-processing later
    } catch(e) {
      log("Inference error: " + e.message, "red");
    }
  };
  img.src = URL.createObjectURL(fileInput.files[0]);
}

// Webcam functions (basic for now)
async function startWebcam() {
  stream = await navigator.mediaDevices.getUserMedia({video: true});
  document.getElementById('video').srcObject = stream;
  log("Webcam started");
}

function stopWebcam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  log("Webcam stopped");
}

log("Page loaded. Please load your best.onnx model.");
</script>
</body>
</html>
