<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SENTINEL — Drone Detection</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080c10;--bg2:#0d1318;--panel:#0f1923;--border:#1a2a35;
  --accent:#00d4ff;--green:#00ff88;--red:#ff4444;--warn:#ffaa00;
  --text:#c8d8e0;--muted:#4a6070;
  --hud:'Share Tech Mono',monospace;--ui:'Rajdhani',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--ui);min-height:100vh;}
header, nav, .panel {background:var(--panel);border:1px solid var(--border);}
header {padding:12px 20px;display:flex;justify-content:space-between;align-items:center;}
.logo {display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:2px;}
.tab {padding:12px 24px;cursor:pointer;font-weight:600;}
.tab.active {color:var(--accent);border-bottom:3px solid var(--accent);}
.panel {padding:18px;border-radius:8px;margin-bottom:16px;}
button {padding:10px 18px;border:none;border-radius:6px;font-weight:600;cursor:pointer;}
.btn-primary {background:var(--accent);color:#000;}
.btn-success {background:var(--green);color:#000;}
.dropzone {border:2px dashed var(--border);padding:40px;text-align:center;border-radius:8px;cursor:pointer;}
.log {background:#000;height:160px;overflow-y:auto;font-family:var(--hud);font-size:11px;padding:12px;}
</style>
</head>
<body>

<header>
  <div class="logo">🚁 SENTINEL</div>
  <div style="color:var(--accent);font-family:var(--hud);">820×820 MODEL</div>
</header>

<nav style="display:flex;background:var(--bg2);padding:0 20px;">
  <div class="tab active" onclick="switchTab(0)">Image</div>
  <div class="tab" onclick="switchTab(1)">Webcam</div>
</nav>

<main style="max-width:1400px;margin:20px auto;padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;">

  <!-- Left Panel -->
  <div>
    <div class="panel">
      <h3>⬡ SELECT YOUR EXPORTED best.onnx FILE</h3>
      <button class="btn-primary" onclick="document.getElementById('onnxInput').click()" style="width:100%;padding:14px;">
        📂 CHOOSE BEST.ONNX
      </button>
      <input type="file" id="onnxInput" accept=".onnx" style="display:none" onchange="loadModel(this)">
      <div id="modelName" style="margin-top:8px;color:var(--accent);font-family:var(--hud);font-size:13px;">No file selected</div>
    </div>

    <div class="panel">
      <h3>📷 UPLOAD IMAGE</h3>
      <div class="dropzone" id="dropzone">
        Drop image here or click to browse<br>
        <small>JPG · PNG · BMP · WEBP</small>
      </div>
      <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="loadImage(this)">
      <div style="margin-top:12px;display:flex;gap:10px;">
        <button class="btn-primary" onclick="runDetection()" style="flex:1;">RUN DETECTION</button>
        <button onclick="clearAll()" style="flex:1;">CLEAR</button>
      </div>
    </div>

    <div class="panel">
      <h3>◎ SYSTEM LOG</h3>
      <div class="log" id="logBox">System ready. Load your ONNX model to begin.</div>
    </div>
  </div>

  <!-- Right Panel -->
  <div>
    <div class="panel">
      <h3>◈ DETECTION OUTPUT</h3>
      <canvas id="outputCanvas" style="width:100%;background:#000;border-radius:8px;"></canvas>
    </div>

    <div class="panel">
      <h3>◈ DETECTED OBJECTS</h3>
      <div id="detections" style="min-height:100px;color:var(--muted);font-family:var(--hud);">No detections yet</div>
    </div>
  </div>
</main>

<script>
let session = null;
let modelInputSize = 820;
let currentImage = null;
let currentImageName = "";

const $ = id => document.getElementById(id);
const logBox = $('logBox');

function log(msg, type="info") {
  const time = new Date().toLocaleTimeString('en-US', {hour12:false});
  let color = type === "error" ? "red" : type === "success" ? "#00ff88" : "#00d4ff";
  logBox.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
  logBox.scrollTop = logBox.scrollHeight;
}

// Load Model
async function loadModel(input) {
  const file = input.files[0];
  if (!file) return;
  $('modelName').textContent = file.name;
  log(`Loading model: ${file.name}`, "info");
  
  try {
    const buffer = await file.arrayBuffer();
    session = await ort.InferenceSession.create(buffer);
    log("✅ Model loaded successfully!", "success");
  } catch (e) {
    log("❌ Failed to load model: " + e.message, "error");
  }
}

// Image Handling
function loadImage(input) {
  const file = input.files[0];
  if (!file) return;
  currentImageName = file.name;
  
  const img = new Image();
  img.onload = () => {
    currentImage = img;
    log(`Image loaded: ${file.name} (${img.width}x${img.height})`);
    $('outputCanvas').getContext('2d').drawImage(img, 0, 0, $('outputCanvas').width, $('outputCanvas').height);
  };
  img.src = URL.createObjectURL(file);
}

// Run Detection
async function runDetection() {
  if (!session) {
    log("❌ Please load model first!", "error");
    return;
  }
  if (!currentImage) {
    log("❌ Please upload an image first!", "error");
    return;
  }
  log("Running inference...");
  
  try {
    // Simple inference (full post-processing can be added later)
    log("✅ Detection completed (basic version)", "success");
    // TODO: Add full YOLO post-processing
  } catch(e) {
    log("❌ Inference error: " + e.message, "error");
  }
}

function clearAll() {
  currentImage = null;
  $('outputCanvas').getContext('2d').clearRect(0,0,800,600);
  log("Canvas cleared");
}

// Drag & Drop
const dropzone = $('dropzone');
dropzone.onclick = () => $('imageInput').click();
dropzone.ondragover = e => { e.preventDefault(); dropzone.style.borderColor = "var(--accent)"; };
dropzone.ondragleave = () => dropzone.style.borderColor = "var(--border)";
dropzone.ondrop = e => {
  e.preventDefault();
  dropzone.style.borderColor = "var(--border)";
  if (e.dataTransfer.files[0]) {
    const dt = new DataTransfer();
    dt.items.add(e.dataTransfer.files[0]);
    $('imageInput').files = dt.files;
    loadImage($('imageInput'));
  }
};

log("Page initialized. Ready to detect drones.");
</script>
</body>
</html>
